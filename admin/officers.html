<!DOCTYPE html>

<html lang="fil">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Manage Officers | Dalubwikaan Admin
</title>


<link rel="stylesheet" href="css/admin.css">


</head>


<body>



<header>

<h1>
OFFICERS MANAGEMENT
</h1>


<button id="logout">
Logout
</button>


</header>





<main>


<section class="admin-form">


<h2>
Add Officer
</h2>



<input 
id="name"
placeholder="Officer Name">



<input 
id="position"
placeholder="Position">



<textarea
id="description"
placeholder="Description">
</textarea>




<input 
type="number"
id="order"
placeholder="Display Order">



<input
type="file"
id="photo">





<button id="saveOfficer">

Save Officer

</button>



</section>






<section>


<h2>
Current Officers
</h2>



<div id="officerList">

</div>



</section>



</main>






<script type="module" src="js/officers-admin.js"></script>


</body>


</html>
