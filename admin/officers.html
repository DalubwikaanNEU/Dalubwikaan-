<!DOCTYPE html>

<html lang="fil">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Officers Management | Dalubwikaan Admin
</title>


<link rel="stylesheet" href="css/admin.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>




<body>




<header>


<div>

<h1>
OFFICERS MANAGEMENT
</h1>


<p>
Pamamahala ng Lupon ng mga Opisyales
</p>


</div>




<button id="logout">

Logout

</button>


</header>







<main>



<section class="admin-form">



<h2>

<i class="fa-solid fa-user-plus"></i>

Magdagdag ng Opisyal

</h2>





<input

type="text"

id="name"

placeholder="Pangalan ng Opisyal"

>





<input

type="text"

id="position"

placeholder="Posisyon"

>






<textarea

id="description"

placeholder="Maikling paglalarawan">

</textarea>






<input

type="number"

id="order"

placeholder="Display Order"

>






<label>

Larawan ng Opisyal

</label>





<input

type="file"

id="photo"

accept="image/*"

>






<button id="saveOfficer">


<i class="fa-solid fa-save"></i>

Save Officer


</button>



</section>









<section>



<h2>

<i class="fa-solid fa-users"></i>

Kasalukuyang Opisyales

</h2>





<div id="officerList">


</div>



</section>






</main>







<script type="module" src="js/officers-admin.js"></script>


</body>


</html>
